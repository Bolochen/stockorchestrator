services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockorchestrator_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: stockorchestrator
      DB_USERNAME: bolo
      DB_PASSWORD: bolo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: redis
      CACHE_STORE: redis
    networks:
      - stockorchestrator_network
    depends_on:
      - pgsql
      - redis

  nginx:
    image: nginx:alpine
    container_name: stockorchestrator_nginx
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - stockorchestrator_network
    depends_on:
      - app

  pgsql:
    image: postgres:15
    container_name: orchestrator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockorchestrator
      POSTGRES_USER: bolo
      POSTGRES_PASSWORD: bolo
    volumes:
      - stockorchestrator_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bolo -d stockorchestrator']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockorchestrator_network

  redis:
    image: redis:alpine
    container_name: stockorchestrator_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - stockorchestrator_network

volumes:
  stockorchestrator_data:

networks:
  stockorchestrator_network:
    driver: bridge
